baseURL = 'https://almstueberlmusi.at/'
locale = 'de-AT'

title = 'Almstüberl Musi'
theme = "bienensteff"

[params]
description = 'Echte Volksmusik aus dem gesamten Alpenland'
# Dunkles Farbschema, wenn das System des Besuchers auf dunkel steht. Es gibt
# keinen Schalter auf der Seite.
darkMode = true
# Kontaktblock im Footer (layouts/_partials/footer.html), Markdown.
contact = """Rupert Pirchner

[+43 664 8987056](tel:+436648987056)

[rpirchner@gmx.at](mailto:rpirchner@gmx.at)
"""

[menus]
[[menus.main]]
name = "Booking"
pageRef = "/booking"
weight = 10

[[menus.main]]
name = "Veranstaltungen"
pageRef = "/veranstaltungen"
weight = 20

[[menus.main]]
name = "Galerie"
pageRef = "/galerie"
weight = 30

[[menus.main]]
name = "Über uns"
pageRef = "/über-uns"
weight = 40

# Footer: je ein Menue pro Spalte, siehe layouts/_partials/footer.html.
[[menus.footerLinks]]
name = 'Instagram'
URL = 'https://www.instagram.com/almstueberl_musi'
weight = 10

[[menus.footerLegal]]
name = 'Impressum'
pageRef = '/impressum'
weight = 10

[[menus.footerLegal]]
name = 'Datenschutz'
pageRef = '/datenschutz'
weight = 20


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '„'
        leftSingleQuote = '‚'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '”'
        rightSingleQuote = '‘' 

[imaging]
  resampleFilter = "Lanczos"

  # Global nur fuer Hugo < 0.163 (z.B. das Fedora-Paket), das die Werte pro
  # Format unten noch nicht kennt und sonst mit 75 baut. Neuere Versionen
  # melden den Schluessel als veraltet (nur auf Log-Level info) und nehmen
  # die Werte pro Format. Kann weg, sobald lokal kein altes Hugo mehr laeuft.
  quality = 90

  # Wie beehen.de/bienensteff.de: verlustbehaftete Qualitaet fuer verkleinerte
  # Bilder (WebP ueber die fig-/image-Partials). Bei 80 waren Artefakte in
  # weichen Verlaeufen (unscharfe Hintergruende) sichtbar, daher 90.
  # Pro Format gesetzt, das globale imaging.quality ist seit Hugo 0.163
  # deprecated.
  [imaging.webp]
    quality = 90

  [imaging.jpeg]
    quality = 90
