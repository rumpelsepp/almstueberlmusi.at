baseURL = 'https://almstueberlmusi.at/'
locale = 'de-AT'

title = 'Almstüberl Musi'
theme = "bienensteff"

[params]
description = 'Echte Volksmusik aus dem gesamten Alpenland'
# Kontaktblock im Footer (layouts/_partials/footer.html), Markdown.
contact = """Rupert Pirchner

<i class="bi bi-telephone" aria-hidden="true"></i> [+43 664 8987056](tel:+436648987056)  
<i class="bi bi-envelope" aria-hidden="true"></i> [rpirchner@gmx.at](mailto:rpirchner@gmx.at)
"""

[menus]
[[menus.main]]
name = "Booking"
pageRef = "/booking"
weight = 10

[[menus.main]]
name = "Veranstaltungen"
pageRef = "/veranstaltungen"
weight = 20

[[menus.main]]
name = "Galerie"
pageRef = "/galerie"
weight = 30

[[menus.main]]
name = "Über uns"
pageRef = "/über-uns"
weight = 40

# Footer: je ein Menue pro Spalte, siehe layouts/_partials/footer.html.
[[menus.footerLinks]]
pre = '<i class="bi bi-instagram" aria-hidden="true"></i>'
name = 'Instagram'
URL = 'https://www.instagram.com/almstueberl_musi'
weight = 10

[[menus.footerLegal]]
name = 'Impressum'
pageRef = '/impressum'
weight = 10

[[menus.footerLegal]]
name = 'Datenschutz'
pageRef = '/datenschutz'
weight = 20


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        apostrophe = '&rsquo;'
        disable = false
        ellipsis = '&hellip;'
        emDash = '&mdash;'
        enDash = '&ndash;'
        leftAngleQuote = '&laquo;'
        leftDoubleQuote = '„'
        leftSingleQuote = '‚'
        rightAngleQuote = '&raquo;'
        rightDoubleQuote = '”'
        rightSingleQuote = '‘' 

[imaging]
  resampleFilter = "Lanczos"

  # Wie beehen.de/bienensteff.de: verlustbehaftete Qualitaet fuer verkleinerte
  # Bilder (WebP ueber die fig-/image-Partials). Um 80 ist optisch nicht von
  # hoeheren Werten zu unterscheiden, die Dateien sind aber deutlich kleiner.
  # Pro Format gesetzt, das globale imaging.quality ist seit Hugo 0.163
  # deprecated.
  [imaging.webp]
    quality = 80

  [imaging.jpeg]
    quality = 80
